<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FS DIGITAL AGENT</title>

    <meta name="description" content="FS Digital Agent">

    <meta name="theme-color" content="#111827">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <!-- ===========================
         HEADER
    ============================ -->

    <header class="topbar">

        <h1>FS DIGITAL AGENT</h1>

        <span class="status">
            🟢 Online
        </span>

    </header>

    <!-- ===========================
         CHAT AREA
         Seluruh pesan dibuat
         melalui JavaScript
    ============================ -->

    <main id="chatArea">

    </main>

    <!-- ===========================
         INPUT
    ============================ -->

    <footer class="chatbox">

        <input
            id="userInput"
            type="text"
            placeholder="Ketik pesan..."
            autocomplete="off"
            spellcheck="false"
        >

        <button
            id="sendBtn"
            type="button">

            ↑

        </button>

    </footer>

</div>

<!-- ===========================
     SCRIPT
=========================== -->

<script src="script.js"></script>

</body>

</html>
