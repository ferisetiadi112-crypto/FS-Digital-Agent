<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FS DIGITAL AGENT</title>

    <meta name="description" content="FS Digital Agent">

    <meta name="theme-color" content="#111827">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="topbar">

        <h1>FS DIGITAL AGENT</h1>

        <span class="status">
            🟢 Online
        </span>

    </header>

    <!-- CHAT -->

    <main id="chatArea">

        <div class="message ai">

            <div class="bubble">

                Halo Prof Feri 👋

                <br><br>

                Apa yang ingin kita kerjakan hari ini?

            </div>

        </div>

    </main>

    <!-- INPUT -->

    <footer class="chatbox">

        <input
            id="userInput"
            type="text"
            placeholder="Ketik pesan..."
            autocomplete="off"
        >

        <button id="sendBtn">

            ↑

        </button>

    </footer>

</div>

<script src="script.js"></script>

</body>

</html>
